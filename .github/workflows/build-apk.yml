name: Build the Hattie APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find the Android SDK
        run: |
          set -e
          if [ -z "${ANDROID_HOME:-}" ]; then
            for d in "$HOME/android-sdk" /usr/local/lib/android/sdk; do
              if [ -d "$d" ]; then ANDROID_HOME="$d"; break; fi
            done
          fi
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "No Android SDK here - fetching the command-line tools."
            ANDROID_HOME=/usr/local/lib/android/sdk
            sudo mkdir -p "$(dirname "$ANDROID_HOME")"
            curl -sSLo /tmp/cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            sudo mv /tmp/cmdline/cmdline-tools "$ANDROID_HOME"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Using SDK at $ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          echo "platforms:"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "build-tools:"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Accept the licences, and add the one platform this project wants
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: ${SDKMANAGER:-none found}"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 \
              || echo "sdkmanager could not add those; Gradle will fetch what it needs"
          fi

      - name: Let Gradle fetch anything the SDK is missing
        run: echo "android.builder.sdkDownload=true" >> gradle.properties

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Hand back the APK
        uses: actions/upload-artifact@v4
        with:
          name: hattie-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
